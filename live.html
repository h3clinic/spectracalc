<!doctype html>
<meta charset="utf-8">
<title>SpectraWolf Live — digitizing</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#0b0d10;--pan:#12151a;--line:#232833;--ink:#e9ecf1;--dim:#8b94a3;
      --c1:#ff5a4d;--c2:#37d17a;--c3:#f0a83a;--hot:#ffd24a;--acc:#5aa2ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);overflow:hidden;
  font:13.5px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#top{display:flex;gap:9px;align-items:center;padding:9px 14px;background:#0e1116;
  border-bottom:1px solid var(--line);height:50px}
#top b{font-size:14px;letter-spacing:.2px}#top b i{color:var(--hot);font-style:normal}
select,button,input[type=range]{background:#1a1f28;color:var(--ink);border:1px solid var(--line);
  border-radius:7px;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer}
button.go{background:var(--acc);border-color:var(--acc);color:#08101d;font-weight:680;min-width:96px}
button:hover{border-color:#3a4454}
#grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(340px,1fr);
  height:calc(100vh - 50px - 46px)}
#plate{position:relative;background:#07090c;overflow:hidden}
#plateCv{position:absolute;inset:0;width:100%;height:100%}
#right{display:grid;grid-template-rows:210px minmax(0,1fr);border-left:1px solid var(--line);
  background:var(--pan)}
#loupeWrap{position:relative;border-bottom:1px solid var(--line);background:#07090c}
#loupe{position:absolute;inset:0;width:100%;height:100%}
#loupeWrap .tag,#chartWrap .tag{position:absolute;left:11px;top:9px;font-size:11px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--dim);z-index:2}
#chartWrap{position:relative}
#chart{position:absolute;inset:0;width:100%;height:100%}
#bot{display:flex;gap:0;align-items:stretch;height:46px;border-top:1px solid var(--line);
  background:#0e1116}
.stat{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 14px;
  border-right:1px solid var(--line)}
.stat u{text-decoration:none;color:var(--dim);font-size:10.5px;letter-spacing:.07em;
  text-transform:uppercase}
.stat b{font-size:15px;font-variant-numeric:tabular-nums;font-weight:620}
#msg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;
  color:var(--dim);font-size:14px;pointer-events:none}
</style>

<div id="top">
  <b>Spectra<i>Wolf</i> Live</b>
  <select id="page"></select>
  <button id="up">⬆ Upload</button><input id="file" type="file" accept="image/*" hidden>
  <button id="go" class="go">▶ Digitize</button>
  <span style="color:var(--dim);font-size:12px">speed</span>
  <input id="speed" type="range" min="1" max="60" value="14" style="width:120px;padding:0">
  <span style="margin-left:auto;color:var(--dim);font-size:12px" id="hint">
    watching the trace come off the page, column by column</span>
</div>

<div id="grid">
  <div id="plate"><canvas id="plateCv"></canvas><div id="msg">loading…</div></div>
  <div id="right">
    <div id="loupeWrap"><span class="tag">under the needle · 8×</span><canvas id="loupe"></canvas></div>
    <div id="chartWrap"><span class="tag">spectrum, as it is extracted</span><canvas id="chart"></canvas></div>
  </div>
</div>

<div id="bot">
  <div class="stat"><u>column</u><b id="sx">—</b></div>
  <div class="stat"><u>wavelength</u><b id="swl">—</b></div>
  <div class="stat"><u>intensity</u><b id="sin">—</b></div>
  <div class="stat"><u>points</u><b id="spt">0</b></div>
  <div class="stat"><u>ink runs read</u><b id="srn">0</b></div>
  <div class="stat" style="border-right:0"><u>state</u><b id="sst">idle</b></div>
</div>
<script src="live.js"></script>
