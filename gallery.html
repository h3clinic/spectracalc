    const name = f.replace('.png', '') + ' — ' + entries[i].n;
    if (filter && !name.toLowerCase().includes(filter.toLowerCase())) return;
    const div = document.createElement('div');
    div.className = 'item' + (i === idx ? ' active' : '');
    div.textContent = name;
    div.onclick = () => show(i);
    list.appendChild(div);
  });
}

function show(i) {
  if (i < 0 || i >= files.length) return;
  idx = i;
  document.getElementById('img').src = 'overlays/' + files[i];
  document.getElementById('titleEl').textContent = files[i].replace('.png', '') + ' — ' + entries[i].n;
  document.getElementById('countEl').textContent = (i + 1) + ' / ' + files.length;
  buildList(document.getElementById('search').value);
  const active = document.querySelector('.item.active');
  if (active) active.scrollIntoView({ block: 'nearest' });
}

function go(d) { show(idx + d); }

document.getElementById('search').addEventListener('input', e => buildList(e.target.value));
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { go(-1); e.preventDefault(); }
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { go(1); e.preventDefault(); }
});

buildList('');
show(0);
</script>
</body>
</html>
